# 正式发布：推送 v* 标签后，分别在 macOS 与 Windows runner 上用 `mygo build` 打包并签名，
# 两边都成功才创建 GitHub Release 并上传安装包。
#
# - macOS：Developer ID 签名 + Apple 公证（mygo.config.ts 的 macos.signingIdentity / notarize），
#   证书与公证凭证来自 secrets，导入到本次运行的临时钥匙串。
# - Windows：SSL.com eSigner CodeSignTool 签 exe、卸载程序和安装包
#   （mygo.config.ts 的 windows.signCommand → scripts/sign-windows-esigner.ps1）。
# - 任何一个 secret 缺失都会在开头失败，不会发布未签名的安装包。
#
# 需要的 secrets（与 citebox / wisp-science 同名，可直接复用同一套证书）：
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD,
#   ESIGNER_CREDENTIAL_ID, ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_TOTP_SECRET, ESIGNER_PIN
#
# 手动触发（workflow_dispatch）可以对已有标签重新构建；不勾选 publish 时只把安装包留作
# workflow artifact，用来验证签名而不动 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的标签（如 v0.1.0，必须已存在）
        required: true
        type: string
      publish:
        description: 创建 / 更新 GitHub Release（不勾选则只保留 workflow artifact，签名照常进行）
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  NOTARY_PROFILE: bibliocell-notary

jobs:
  check:
    name: Check tag and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Tag must match package.json version
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag must look like v0.1.0, got ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${version}. Bump the version and tag again." >&2
            exit 1
          fi
          echo "Releasing ${RELEASE_TAG} (package.json ${version})"

      - name: Require signing secrets
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD \
                      ESIGNER_CREDENTIAL_ID ESIGNER_USERNAME ESIGNER_PASSWORD ESIGNER_TOTP_SECRET ESIGNER_PIN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Releases are always signed. Missing repository secrets: ${missing[*]}" >&2
            exit 1
          fi
          echo "All signing secrets present"

  macos:
    name: macOS (universal, signed + notarized)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci

      # 与 citebox / wispterm 相同的导入方式：临时钥匙串，签名身份在运行时从证书里读出，
      # 不需要单独的 identity secret。
      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/bibliocell-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          python3 -c 'import base64, os; open("cert.p12", "wb").write(base64.b64decode(os.environ["MAC_CERT_P12_BASE64"].strip()))'

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain
          security default-keychain -s "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security import cert.p12 -k "${KEYCHAIN_PATH}" -P "${MAC_CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          rm -f cert.p12

          echo "Codesigning identities after import:"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"
          identity="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "${identity}" ]]; then
            echo "::error::No Developer ID Application identity in keychain. Check MAC_CERT_P12_BASE64 / MAC_CERT_PASSWORD and that the .p12 includes the private key." >&2
            exit 1
          fi
          {
            echo "CODESIGN_IDENTITY=${identity}"
            echo "CODESIGN_KEYCHAIN=${KEYCHAIN_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "${NOTARY_PROFILE}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}"

      # mygo build：跑 buildCommand（tsc + vite）、编译通用二进制、签名 .app、做 DMG、
      # 提交公证并把票据钉到 DMG 和 .app 上。
      - name: Build, sign and notarize
        env:
          BIBLIOCELL_MACOS_SIGNING_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          BIBLIOCELL_NOTARY_PROFILE: ${{ env.NOTARY_PROFILE }}
        run: npx mygo build -platform darwin/universal

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmgs=(build/*/bibliocell-"${version}".dmg)
          if (( ${#dmgs[@]} != 1 )) || [[ ! -f "${dmgs[0]}" ]]; then
            echo "::error::Expected one DMG build/*/bibliocell-${version}.dmg, found: ${dmgs[*]}" >&2
            ls -R build || true
            exit 1
          fi
          dmg="${dmgs[0]}"
          app="$(dirname "${dmg}")/BiblioCell.app"
          test -d "${app}"

          codesign --verify --strict --verbose=2 "${app}"
          codesign -dvv "${app}" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier' || true
          codesign --verify --verbose=2 "${dmg}"
          lipo -info "${app}/Contents/MacOS/BiblioCell"

          # stapler validate 会联网核对票据，偶发 CloudKit 断连时重试。
          for attempt in 1 2 3 4 5; do
            if xcrun stapler validate "${dmg}"; then break; fi
            status=$?
            if (( attempt == 5 )); then exit "${status}"; fi
            sleep $((15 * attempt))
          done
          xcrun stapler validate "${app}"
          spctl --assess --type open --context context:primary-signature -vv "${dmg}"

          echo "DMG_PATH=${dmg}" >> "${GITHUB_ENV}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.RELEASE_TAG }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${CODESIGN_KEYCHAIN:-}" && -f "${CODESIGN_KEYCHAIN}" ]]; then
            security delete-keychain "${CODESIGN_KEYCHAIN}" || true
          fi

  windows:
    name: Windows (amd64, signed)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
      ESIGNER_PIN: ${{ secrets.ESIGNER_PIN }}
    steps:
      # job 级 env 里拿不到 runner 上下文，日志路径在这里设。
      - name: Set eSigner sign log path
        shell: pwsh
        run: '"ESIGNER_SIGN_LOG=$env:RUNNER_TEMP\esigner-signed.log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci

      - name: Cache CodeSignTool
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/CodeSignTool
          key: codesigntool-1.3.2-windows

      - name: Install CodeSignTool
        shell: pwsh
        run: pwsh -NoProfile -File scripts/sign-windows-esigner.ps1 -Install

      # mygo build 会自己下载 NSIS；缓存起来省掉每次下载。
      - name: Cache NSIS
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('package-lock.json') }}

      # signCommand 由 mygo 通过 cmd /s /c 执行，%1 会被替换成带引号的文件路径。
      # 签名失败会让 mygo build 失败，所以不可能产出未签名的安装包。
      - name: Build and sign
        shell: pwsh
        env:
          BIBLIOCELL_WINDOWS_SIGN_COMMAND: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/sign-windows-esigner.ps1 -Path %1
        run: |
          npx mygo build -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { throw "mygo build exited $LASTEXITCODE" }

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $setup = @(Get-ChildItem -Path "build/*/bibliocell-setup-$version-amd64.exe" -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) {
            Get-ChildItem -Recurse build | Select-Object -ExpandProperty FullName
            throw "Expected one installer build/*/bibliocell-setup-$version-amd64.exe, found $($setup.Count)"
          }
          $files = @($setup[0].FullName, (Join-Path $setup[0].DirectoryName 'BiblioCell.exe'))
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            $leaf = [IO.Path]::GetFileName($file)
            if ("$($sig.Status)" -ne 'Valid') { throw "$leaf Authenticode status $($sig.Status): $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$leaf has no RFC3161 timestamp" }
            Write-Host "${leaf}: $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
          if (-not (Test-Path -LiteralPath $env:ESIGNER_SIGN_LOG)) { throw "eSigner sign log not found: $env:ESIGNER_SIGN_LOG" }
          $log = Get-Content -LiteralPath $env:ESIGNER_SIGN_LOG
          Write-Host "eSigner signed:"; $log | ForEach-Object { Write-Host "  $_" }
          # 应用 exe、卸载程序、安装包：三次签名都要在日志里。
          if (@($log | Where-Object { $_ -like 'signed*' }).Count -lt 3) { throw "Expected at least 3 eSigner signatures (app, uninstaller, installer)" }
          "SETUP_PATH=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.RELEASE_TAG }}
          path: ${{ env.SETUP_PATH }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          ls -la
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | sort -z)
          if (( ${#files[@]} != 2 )); then
            echo "::error::Expected one DMG and one installer, found: ${files[*]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sed 's#\./##' > SHA256SUMS
          cat SHA256SUMS
          files+=("SHA256SUMS")
          cd ..

          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          asset_notes="$(printf '%s\n' \
            '## 下载' \
            '' \
            '- macOS：`bibliocell-<版本>.dmg`，Apple Silicon 与 Intel 通用，Developer ID 签名并经 Apple 公证。' \
            '- Windows：`bibliocell-setup-<版本>-amd64.exe`，带 Authenticode 签名的安装包（SSL.com）。' \
            '- `SHA256SUMS`：以上文件的校验和。')"
          if [[ -f "${notes_file}" ]]; then
            notes="$(cat "${notes_file}")"$'\n\n'"${asset_notes}"
          else
            notes="${asset_notes}"
          fi

          assets=()
          for f in "${files[@]}"; do assets+=("release-assets/${f#./}"); done
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber --repo "${GH_REPO}"
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --title "BiblioCell ${RELEASE_TAG}" \
              --notes "${notes}" \
              --generate-notes
          fi
