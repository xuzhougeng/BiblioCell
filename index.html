<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8e3cd">
  <meta name="description" content="单细胞文献与数据集的个人研究管理空间。先收齐文献，再逐步补充全文、数据和研究记录。">
  <title>BiblioCell · 单细胞文献库</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg">
</head>
<body>
  <a class="skip-link" href="#app-content">跳至内容</a>
  <aside class="sidebar" aria-label="主导航">
    <a href="#overview" class="brand" data-page="overview" aria-label="BiblioCell 总览">
      <svg class="brand-mark" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#f2ecdb"/><path d="M11 12C11 8 18 8 20 12C22 8 29 8 29 12V19C29 23 22 24 20 20C18 24 11 23 11 19Z" fill="#4f8a68"/><path d="M11 25C11 21 18 21 20 25C22 21 29 21 29 25V28C29 32 22 33 20 29C18 33 11 32 11 28Z" fill="#86b48d"/><circle cx="15.5" cy="15.5" r="1.9" fill="#f2ecdb"/><circle cx="24.5" cy="15.5" r="1.9" fill="#f2ecdb"/></svg>
      <span><strong>Biblio<span class="brand-light">Cell</span></strong><small>单细胞文献库</small></span>
    </a>
    <div class="workspace-label"><span class="workspace-dot"></span>个人研究空间<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <div class="sidebar-scroll">
      <div class="nav-label">研究工作台</div>
      <nav class="nav-list">
        <a href="#overview" data-page="overview" class="nav-item active"><span data-icon="home"></span><span>总览</span></a>
        <a href="#papers" data-page="papers" class="nav-item"><span data-icon="book"></span><span>文献库</span><span class="nav-count" id="count-papers">—</span></a>
        <a href="#datasets" data-page="datasets" class="nav-item"><span data-icon="database"></span><span>数据集</span><span class="nav-count" id="count-datasets">—</span></a>
        <a href="#tasks" data-page="tasks" class="nav-item"><span data-icon="check"></span><span>待补事项</span><span class="nav-count" id="count-tasks">—</span></a>
      </nav>
      <div class="nav-label nav-label-spaced">管理</div>
      <nav class="nav-list">
        <a href="#sources" data-page="sources" class="nav-item"><span data-icon="refresh"></span><span>来源与更新</span></a>
        <a href="#schema" data-page="schema" class="nav-item"><span data-icon="grid"></span><span>数据库设计</span></a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-note"><span class="tiny-label">持续积累，逐步完善</span><p>先留下每一篇研究，<br>再补齐它背后的数据。</p><div class="note-line"><i></i><i></i><i></i><i></i><i></i></div></div>
      <a href="#settings" data-page="settings" class="nav-item sidebar-settings"><span data-icon="settings"></span><span>设置</span></a>
      <div class="profile"><div class="avatar">B</div><div><strong>我的研究库</strong><small>私人工作空间</small></div><span class="version">v0.1</span></div>
    </div>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <button class="mobile-menu btn-icon" id="mobile-menu" aria-label="展开导航" aria-expanded="false"><span data-icon="more"></span></button>
      <button type="button" class="sidebar-collapse" id="sidebar-collapse" aria-label="折叠侧栏" aria-expanded="true" title="折叠侧栏"><span data-icon="chevron-right"></span></button>
      <div class="breadcrumb"><span>我的研究空间</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-current">总览</strong></div>
      <div class="topbar-right">
        <label class="global-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="搜索文献、物种、关键词…" aria-label="全局搜索文献"><kbd>/</kbd></label>
        <span class="private-badge"><span class="workspace-dot"></span>仅自己可见</span>
      </div>
    </header>
    <main class="workspace-main">
      <div class="prototype-note"><span class="prototype-badge" id="runtime-badge">正在启动</span><span id="runtime-message">正在连接 Go 后端…</span><a href="#schema" data-page="schema">查看设计说明<span data-icon="arrow-up-right"></span></a></div>
      <div class="page-heading">
        <div><div class="eyebrow">SINGLE-CELL RESEARCH</div><h1 id="page-title">研究总览</h1><p id="page-subtitle">从文献发现，到数据复用。每一步都有记录。</p></div>
        <div class="heading-actions"><button class="btn btn-secondary" data-action="import-json"><span data-icon="upload"></span>导入记录</button><button class="btn btn-primary" data-action="new-paper"><span data-icon="plus"></span>添加文献</button></div>
      </div>
      <div id="app-content" tabindex="-1" aria-live="polite"><div class="empty-state"><h2>正在打开研究库</h2><p>加载文献与整理记录…</p></div></div>
      <footer class="workspace-footer"><span>BiblioCell <span class="footer-dot">·</span> 为持续研究留一份有序记录</span><a href="./docs/design.html" target="_blank" rel="noopener">设计文档<span data-icon="arrow-up-right"></span></a></footer>
    </main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" role="status"></div>
  <script>
    const paths={
      home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
      book:'<path d="M12 5v16M3 4h5a4 4 0 0 1 4 2 4 4 0 0 1 4-2h5v15h-5a5 5 0 0 0-4 2 5 5 0 0 0-4-2H3Z"/>',
      database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/>',
      check:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 3 3 5-6M8 3V1m8 2V1"/>',
      calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',
      plus:'<path d="M12 5v14M5 12h14"/>',
      'arrow-right':'<path d="M4 12h16m-6-6 6 6-6 6"/>',
      'arrow-up-right':'<path d="M6 18 18 6M6 6h12v12"/>',
      'chevron-down':'<path d="m6 9 6 6 6-6"/>',
      'chevron-right':'<path d="m9 5 7 7-7 7"/>',
      filter:'<path d="M4 6h16M7 12h10m-7 6h4"/>',
      download:'<path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/>',
      file:'<path d="M14 2H5a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8Z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/>',
      link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>',
      x:'<path d="m6 6 12 12M6 18 18 6"/>',
      'check-circle':'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      more:'<path d="M4 6h16M4 12h16M4 18h16"/>',
      star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',
      settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-.5 3-2.7 1.5-2.8-1L1.5 9l2.3 2v3L1.5 16 3 18.5l2.8-1L8.5 19l.5 3h3l.5-3 2.7-1.5 2.8 1 1.5-2.5-2.3-2v-3l2.3-2L18 6.5l-2.8 1L12.5 6 12 3Z"/>',
      leaf:'<path d="M20 4c-7-2-15 1-15 8a7 7 0 0 0 7 7c7 0 9-8 8-15Z"/><path d="m4 21 11-11M9 16v-5m0 5h5"/>',
      refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.1 8a8 8 0 0 1 13.2-3L20 7M4 17l1.7 2A8 8 0 0 0 18.9 16"/>',
      grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
      code:'<path d="m8 5-7 7 7 7m8-14 7 7-7 7m-3-17-2 20"/>',
      folder:'<path d="M3 5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',
      upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',
      alert:'<path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3v.1"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',
      trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>'
    };
    window.icon=(name,size=18)=>`<svg width="${Number(size)||18}" height="${Number(size)||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.file}</svg>`;
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
    const sidebarCollapse=document.getElementById('sidebar-collapse');
    let sidebarCollapsed=false;try{sidebarCollapsed=localStorage.getItem('bibliocell-sidebar-collapsed')==='true';}catch(_){}
    const applySidebarState=()=>{
      document.body.classList.toggle('sidebar-collapsed',sidebarCollapsed);
      sidebarCollapse.setAttribute('aria-expanded',String(!sidebarCollapsed));
      sidebarCollapse.setAttribute('aria-label',sidebarCollapsed?'展开侧栏':'折叠侧栏');
      sidebarCollapse.title=sidebarCollapsed?'展开侧栏':'折叠侧栏';
    };
    applySidebarState();
    sidebarCollapse.addEventListener('click',()=>{sidebarCollapsed=!sidebarCollapsed;try{localStorage.setItem('bibliocell-sidebar-collapsed',String(sidebarCollapsed));}catch(_){}applySidebarState();});
    document.querySelectorAll('.sidebar .nav-item[data-page]').forEach(el=>{const label=el.querySelector('span:not([data-icon])');if(label)el.title=label.textContent;});
    document.getElementById('mobile-menu').addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');document.getElementById('mobile-menu').setAttribute('aria-expanded',String(open));});
    document.addEventListener('click',e=>{if(e.target.closest('[data-page]'))document.body.classList.remove('nav-open');});
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();document.getElementById('global-search').focus();}});
    window.addEventListener('hashchange',()=>{const titles={overview:'总览',papers:'文献库',datasets:'数据集',tasks:'待补事项',sources:'来源与更新',schema:'数据库设计',settings:'设置'};document.getElementById('breadcrumb-current').textContent=titles[location.hash.slice(1)]||'总览';});
  </script>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
