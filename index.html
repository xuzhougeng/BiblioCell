    <div class="workspace-label"><span class="workspace-dot"></span>个人研究空间<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>

      </nav>

      <nav class="nav-list">

    </main>

  <div id="modal-root"></div>
